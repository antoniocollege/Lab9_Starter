<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
	<script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
	<script>
	  window.TrackJS && TrackJS.install({ 
		token: "16230051b87047edb2fab8cedc3a6b26"
		// for more configuration options, see https://docs.trackjs.com
	  });
	</script>

</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>
  <script>
    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;
      output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

	class InputError extends Error {
	  constructor(message){
		super(message);
		this.name = "InputError";
	  }
	}

	form.addEventListener("submit", e => {
	  e.preventDefault();
	  let output = document.querySelector("output");

	  try {
		let num1 = document.querySelector("#first-num").value;
		let num2 = document.querySelector("#second-num").value;
		let op = document.querySelector("#operator").value;

		if(num1 === "" || num2 === ""){
		  throw new InputError("Fill in both boxes");
		}

		if(isNaN(num1) || isNaN(num2)){
		  throw new InputError("Only numbers allowed");
		}

		num1 = Number(num1);
		num2 = Number(num2);

		if(op === "/" && num2 === 0){
		  throw new InputError("Can't divide by 0");
		}
		output.textContent = eval(`${num1} ${op} ${num2}`);
	  }
	  catch(error){
		output.textContent = error.message;
		console.error(error);
	  }
	  finally{
		console.log("Calculator finished");
	  }
	});


	errorBtns.forEach(button => {
	  button.addEventListener("click", e => {
		e.preventDefault();
		let text = button.textContent;
		if(text === "Console Log"){
		  console.log("hello");
		} else if(text === "Console Error"){
		  console.error("error example");
		} else if(text === "Console Count"){
		  console.count("clicked");
		} else if(text === "Console Warn"){
		  console.warn("warning");
		} else if(text === "Console Assert"){
		  console.assert(2 > 5,"2 is not bigger than 5");
		} else if(text === "Console Clear"){
		  console.clear();
		} else if(text === "Console Dir"){
		  console.dir(document.body);
		} else if(text === "Console dirxml"){
		  console.dirxml(document.body);
		} else if(text === "Console Group Start"){
		  console.group("Group");
		  console.log("first");
		  console.log("second");
		} else if(text === "Console Group End"){
		  console.groupEnd();
		} else if(text === "Console Table"){
		  console.table([
			{name:"Bob", grade:80},
			{name:"Joe", grade:90}
		  ]);
		} else if(text === "Start Timer"){
		  console.time("test");
		} else if(text === "End Timer"){
		  console.timeEnd("test");
		} else if(text === "Console Trace"){
		  test();
		} else if(text === "Trigger a Global Error"){
		  fakeFunction();
		}
	  });
	});

	function test(){
	  console.trace();
	}

	window.onerror = function(){
	  console.log("Global error caught");
	};
  </script>
</body>

</html>
